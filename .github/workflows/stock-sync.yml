name: 재고 품절 동기화

on:
  # 예약 실행은 Supabase pg_cron으로 옮겼다(supabase/migrations/108_pg_cron_stock_sync.sql).
  # GitHub 예약이 5~6시간 간격으로 밀려서다(2026-09-25 실측). 여기는 수동 실행용으로만 남긴다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: '드라이런 (판정만, 변경 없음)'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 동기화 경로 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/stock-sync?dryRun=$DRY&trigger=manual")
          cat body.json
          test "$code" = "200"
