<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>리뷰 이벤트 카드 목업</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #d0d0d0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }

  .page-label {
    font-size: 13px;
    color: #555;
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* A4 용지 */
  .a4 {
    width: 210mm;
    height: 297mm;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    padding: 7mm 5mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 92mm);
    column-gap: 0.9mm;
    row-gap: 1.3mm;
  }

  /* 각 카드 셀 */
  .card {
    width: 99.1mm;
    height: 92mm;
    border: 0.5px solid #ccc;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 상단: 이벤트 제목 ── */
  .card-header {
    background: linear-gradient(135deg, #00704A 0%, #1E3932 100%);
    color: #fff;
    text-align: center;
    padding: 5mm 3mm 4mm;
    flex-shrink: 0;
  }

  .event-label {
    font-size: 9px;
    font-weight: 500;
    opacity: 0.85;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .event-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .event-prize {
    margin-top: 3px;
    font-size: 8.5px;
    font-weight: 600;
    background: rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 2px 8px;
    display: inline-block;
  }

  /* ── 중단: 감사 메시지 ── */
  .card-thanks {
    background: #f9f6f0;
    padding: 4mm 4mm 3.5mm;
    text-align: center;
    flex-shrink: 0;
  }

  .thanks-emoji {
    font-size: 15px;
    display: block;
    margin-bottom: 2px;
  }

  .thanks-main {
    font-size: 10px;
    font-weight: 700;
    color: #1e1e1e;
    line-height: 1.5;
  }

  .thanks-sub {
    font-size: 8.5px;
    color: #6b6b6b;
    margin-top: 2px;
    line-height: 1.4;
  }

  /* ── 하단: 참여 방법 ── */
  .card-steps {
    flex: 1;
    padding: 3mm 4mm 3mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }

  .steps-title {
    font-size: 8px;
    font-weight: 700;
    color: #00704A;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 2mm;
    border-bottom: 1px solid #e5e5e5;
    padding-bottom: 1.5mm;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 8.5px;
    color: #2d2d2d;
    line-height: 1.4;
  }

  .step-num {
    width: 16px;
    height: 16px;
    background: #00704A;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .step-arrow {
    font-size: 7px;
    color: #00704A;
    margin: 0 1px;
  }

  /* ── 하단 연락처 ── */
  .card-contact {
    background: #1E3932;
    color: rgba(255,255,255,0.75);
    text-align: center;
    padding: 2mm;
    font-size: 7.5px;
    flex-shrink: 0;
  }

  .card-contact b {
    color: #fff;
    font-weight: 700;
  }

  @media print {
    body { background: none; padding: 0; }
    .page-label { display: none; }
    .a4 { box-shadow: none; }
    @page { margin: 0; size: A4; }
  }
</style>
</head>
<body>

<div class="page-label">A4 라벨지 미리보기 (2×3 · 99.1×92mm × 6칸)</div>

<div class="a4">
  <!-- 6칸 동일 카드 반복 -->
  <div class="card">
    <div class="card-header">
      <div class="event-label">☕ Review Event</div>
      <div class="event-title">리뷰 이벤트</div>
      <div class="event-prize">100% 전원 스타벅스 아메리카노 기프트콘 증정</div>
    </div>
    <div class="card-thanks">
      <span class="thanks-emoji">🙏</span>
      <div class="thanks-main">구매해 주셔서 진심으로 감사드립니다!</div>
      <div class="thanks-sub">소중한 리뷰 한 줄이 저희에게 큰 힘이 됩니다.<br>감사한 마음을 스타벅스 쿠폰으로 전해드립니다 ☕</div>
    </div>
    <div class="card-steps">
      <div class="steps-title">✦ 참여 방법</div>
      <div class="step">
        <div class="step-num">1</div>
        구매하신 쇼핑몰에 상품 후기 남기기
        <span style="color:#00704A; font-size:8px; font-weight:600;">(사진 필수)</span>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        청연코퍼레이션으로 구매 인증 문자 보내기
      </div>
      <div class="step">
        <div class="step-num">3</div>
        스타벅스 아메리카노 기프트콘 수령 🎁
      </div>
    </div>
    <div class="card-contact">
      문자 발송 <b>청연코퍼레이션</b> &nbsp;|&nbsp; 후기 작성 후 연락 주세요
    </div>
  </div>

  <!-- 나머지 5칸 동일 카드 자동 반복 -->
  <script>
    const template = document.querySelector('.card');
    const a4 = document.querySelector('.a4');
    for (let i = 1; i < 6; i++) {
      a4.appendChild(template.cloneNode(true));
    }
  </script>
</div>

</body>
</html>
